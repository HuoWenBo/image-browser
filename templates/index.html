{% extends "_base/base.html" %}

{% block title %}图片社区{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- 导航栏 -->
    <nav class="flex items-center justify-between bg-white border-b border-gray-200 py-2 px-4 md:px-8 mb-4">
        <div class="flex items-center justify-between w-full px-4 sm:px-6 lg:px-8 gap-4">
            <a class="flex items-center text-xl font-bold text-gray-800 no-underline flex-shrink-0"
               href="#">
                <i class="bi bi-images text-blue-600 mr-2"></i> 图集
            </a>

            <!-- 搜索表单 -->
            <form id="search-form"
                  class="flex items-center bg-gray-50 border border-gray-300 rounded-full shadow-sm pl-4 pr-2 py-1.5 w-full max-w-none md:max-w-2xl lg:max-w-3xl focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100 transition"
                  role="search">
                <input id="search-input"
                       type="text"
                       placeholder="搜索图片、标签、角色..."
                       aria-label="Search"
                       class="flex-1 border-none outline-none bg-transparent text-sm min-w-[180px] text-gray-800 placeholder-gray-500 pr-8">
                <button id="search-clear"
                        type="button"
                        class="hidden flex-shrink-0 -ml-7 text-gray-400 hover:text-gray-600 transition z-10 p-1"
                        title="清空搜索">
                    <i class="bi bi-x-lg"></i>
                </button>
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white rounded-full px-5 py-2 text-sm font-medium transition flex-shrink-0">
                    <i class="bi bi-search me-1"></i> 搜索
                </button>
                <button id="search-by-image-btn" type="button"
                        class="bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full px-4 py-2 text-sm font-medium transition flex-shrink-0">
                    <i class="bi bi-image me-1"></i> 以图搜图
                </button>
            </form>

            <div class="flex items-center gap-3 flex-shrink-0">
                <span id="total-count" class="text-gray-500 text-sm hidden sm:inline">共 0 张</span>
                <a href="/admin/image"
                   class="inline-flex items-center bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full px-4 py-2 text-sm font-medium transition no-underline">
                    <i class="bi bi-gear me-1"></i>后台管理
                </a>
            </div>
        </div>
    </nav>

    <!-- 图片网格 -->
    <div id="image-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- 加载 / 空状态 -->
    <div id="grid-status" class="py-16 text-center text-gray-400 hidden">
        <p id="status-text" class="mt-2"></p>
    </div>

    <!-- 分页 -->
    <nav id="pagination" class="mt-5 flex justify-center" aria-label="Page navigation"></nav>

    <!-- 以图搜图弹窗 -->
    <div id="sbi-modal" class="fixed inset-0 z-50 hidden" role="dialog"
         aria-modal="true" aria-label="以图搜图">
        <div id="sbi-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative mx-auto my-6 w-[94vw] max-w-5xl max-h-[88vh] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <h2 class="text-lg font-semibold text-gray-800">
                    <i class="bi bi-image text-blue-600 mr-1"></i> 以图搜图
                </h2>
                <button id="sbi-close" type="button"
                        class="text-gray-400 hover:text-gray-600 text-2xl leading-none transition p-1"
                        title="关闭">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 flex flex-col items-center">
                <!-- 上传区（拖拽 / 点击选择） -->
                <div id="sbi-dropzone"
                     class="w-full max-w-xl border-2 border-dashed border-gray-300 rounded-2xl py-14 px-6 text-center cursor-pointer transition hover:border-blue-400 hover:bg-blue-50">
                    <i class="bi bi-cloud-arrow-up text-5xl text-gray-300"></i>
                    <p class="mt-4 text-gray-700 font-medium">拖拽图片到此处，或点击选择</p>
                    <p class="mt-1 text-sm text-gray-400">支持 JPG / PNG 等常见图片格式</p>
                    <input id="sbi-file" type="file" accept="image/*" class="hidden">
                </div>
                <!-- 预览与操作 -->
                <div id="sbi-meta" class="hidden w-full max-w-2xl flex flex-col items-center">
                    <img id="sbi-preview-img" class="max-h-72 max-w-full rounded-xl border border-gray-200 shadow-sm"
                         alt="上传预览">
                    <p id="sbi-file-name" class="mt-3 text-sm text-gray-600 truncate max-w-full"></p>
                    <button id="sbi-search" type="button" disabled
                            class="mt-5 bg-gray-800 hover:bg-gray-900 text-white rounded-full px-8 py-2.5 text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="bi bi-search me-1"></i> 开始搜索
                    </button>
                </div>
                <!-- 结果 -->
                <div id="sbi-status" class="w-full py-10 text-center text-gray-400 hidden">
                    <i class="bi bi-arrow-repeat text-4xl animate-spin inline-block"></i>
                    <p id="sbi-status-text" class="mt-2"></p>
                </div>
                <div id="sbi-results" class="w-full grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-6"></div>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detail-modal" class="fixed inset-0 z-50 overflow-y-auto hidden" role="dialog"
         aria-modal="true" aria-label="图片详情">
        <div id="modal-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative mx-auto my-6 w-[95vw] max-w-screen-2xl h-[90vh] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
            <div id="detail-image-wrap"
                 class="w-full md:w-2/3 h-64 md:h-full bg-gray-900 flex items-center justify-center p-4 relative">
                <div class="text-white text-center">
                    <i class="bi bi-arrow-repeat text-4xl animate-spin inline-block"></i>
                    <p class="mt-2">加载中...</p>
                </div>
            </div>
            <div class="w-full md:w-1/3 h-1/2 md:h-full overflow-y-auto p-6 bg-white">
                <div id="detail-info"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/utils.js"></script>
<script src="/static/js/pagination.js"></script>
<script src="/static/js/gallery.js"></script>
{% endblock %}
